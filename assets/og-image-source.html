<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>OG Image Source — 넌센스 OX 퀴즈 (1080×1080)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" />
  <style>
    /* =================================================================
       OG Image Source — 1080×1080 (정사각, 카톡·인스타·페북 호환)
       사용법:
       1) 이 파일을 브라우저에서 열기 (file:// 또는 http://localhost)
       2) Chrome DevTools (F12 또는 Cmd+Opt+I) → Cmd+Shift+P → "Capture full size screenshot"
          또는 Cmd+Shift+P → "Capture node screenshot" (.og-card 선택 후)
       3) 저장 파일 → ImageMagick/Preview에서 1080×1080 정사각으로 크롭 (이미 정사각이면 그대로)
       4) assets/og-image.png 로 저장
       ================================================================= */

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .og-card {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at center, #ffec8b 0%, #fdd835 70%, #f9a825 100%);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.4);
    }

    /* ── 방사형 광선 ── */
    .og-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: conic-gradient(
        from 0deg,
        transparent 0deg, rgba(255,255,255,0.18) 8deg,
        transparent 16deg, rgba(255,255,255,0.18) 24deg,
        transparent 32deg, rgba(255,255,255,0.18) 40deg,
        transparent 48deg, rgba(255,255,255,0.18) 56deg,
        transparent 64deg, rgba(255,255,255,0.18) 72deg,
        transparent 80deg, rgba(255,255,255,0.18) 88deg,
        transparent 96deg
      );
      opacity: 0.7;
      mix-blend-mode: overlay;
    }

    /* ── 코인 흩날림 ── */
    .coins {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .coin {
      position: absolute;
      font-size: 64px;
      filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.3));
    }
    .coin:nth-child(1)  { top: 8%;  left: 6%;  transform: rotate(-15deg); }
    .coin:nth-child(2)  { top: 14%; left: 22%; transform: rotate(20deg); }
    .coin:nth-child(3)  { top: 6%;  left: 78%; transform: rotate(-30deg); }
    .coin:nth-child(4)  { top: 18%; left: 92%; transform: rotate(45deg); }
    .coin:nth-child(5)  { top: 80%; left: 4%;  transform: rotate(60deg); }
    .coin:nth-child(6)  { top: 88%; left: 18%; transform: rotate(-20deg); }
    .coin:nth-child(7)  { top: 76%; left: 82%; transform: rotate(15deg); }
    .coin:nth-child(8)  { top: 90%; left: 88%; transform: rotate(-45deg); }

    /* ── 컨텐츠 컨테이너 ── */
    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 80px 60px;
    }

    /* ── 타이틀 영역 ── */
    .titles {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .title-main {
      font-family: "Black Han Sans", sans-serif;
      font-size: 180px;
      line-height: 0.95;
      color: #fff;
      -webkit-text-stroke: 8px #1a1a1a;
      text-shadow:
        10px 10px 0 #1a1a1a,
        -2px -2px 0 #1a1a1a;
      letter-spacing: -4px;
    }
    .title-sub {
      font-family: "Black Han Sans", sans-serif;
      font-size: 80px;
      color: #29b6f6;
      -webkit-text-stroke: 5px #1a1a1a;
      text-shadow: 5px 5px 0 #1a1a1a;
      letter-spacing: -2px;
    }

    /* ── 가운데: 캐릭터 + OX 버튼 ── */
    .arena {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      position: relative;
    }
    .ox-button {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 8px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Black Han Sans", sans-serif;
      font-size: 200px;
      color: #fff;
      -webkit-text-stroke: 6px #1a1a1a;
      text-shadow: 6px 6px 0 #1a1a1a;
      box-shadow:
        0 12px 0 rgba(0,0,0,0.35),
        0 0 40px rgba(0,0,0,0.2);
    }
    .ox-button--o {
      background: radial-gradient(circle at 30% 30%, #4fc3f7, #29b6f6 60%, #0277bd);
      transform: rotate(-8deg);
    }
    .ox-button--x {
      background: radial-gradient(circle at 30% 30%, #ff7961, #ef5350 60%, #c62828);
      transform: rotate(8deg);
    }
    .character {
      font-size: 220px;
      filter: drop-shadow(6px 6px 0 rgba(0,0,0,0.3));
      animation: bob 2s ease-in-out infinite;
    }

    /* ── 카피 ── */
    .copy-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .copy-main {
      font-family: "Jua", sans-serif;
      font-size: 64px;
      color: #1a1a1a;
      background: #fff;
      padding: 16px 48px;
      border-radius: 999px;
      border: 6px solid #1a1a1a;
      box-shadow: 8px 8px 0 #1a1a1a;
      letter-spacing: -1px;
    }
    .copy-sub {
      font-family: "Jua", sans-serif;
      font-size: 36px;
      color: #1a1a1a;
      -webkit-text-stroke: 1px #fff;
    }

    /* ── 애니메이션 (정적 스크린샷이라 효과는 시각적 흥미용) ── */
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    /* ── DevTools 안내 ── */
    .helper-note {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.9);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      max-width: 320px;
      z-index: 9999;
      line-height: 1.5;
    }
    .helper-note kbd {
      background: #444;
      padding: 2px 6px;
      border-radius: 4px;
      margin: 0 2px;
    }
    @media print { .helper-note { display: none; } }
    body.is-clean .helper-note { display: none; }
    body.is-clean { background: transparent; padding: 0; }
    body.is-clean .og-card { box-shadow: none; }
  </style>
</head>
<body>
  <script>
    // ?clean=1 쿼리 시 안내 노트 숨김 (헤드리스 캡처용)
    if (location.search.includes('clean')) {
      document.documentElement.classList.add('is-clean');
      document.addEventListener('DOMContentLoaded', () => document.body.classList.add('is-clean'));
    }
  </script>
  <div class="helper-note">
    <strong>📸 스크린샷 가이드</strong><br/>
    <kbd>F12</kbd> → <kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd><br/>
    → "Capture node screenshot"<br/>
    → 아래 .og-card 선택<br/>
    → assets/og-image.png 저장<br/>
    <br/>
    <em>헤드리스 캡처: <code>?clean=1</code> 쿼리 추가</em>
  </div>

  <div class="og-card">
    <div class="coins" aria-hidden="true">
      <span class="coin">🪙</span>
      <span class="coin">🪙</span>
      <span class="coin">🪙</span>
      <span class="coin">🪙</span>
      <span class="coin">🪙</span>
      <span class="coin">🪙</span>
      <span class="coin">🪙</span>
      <span class="coin">🪙</span>
    </div>

    <div class="content">
      <div class="titles">
        <div class="title-main">넌센스 OX</div>
        <div class="title-sub">1분만 풀어봐!</div>
      </div>

      <div class="arena">
        <div class="ox-button ox-button--o">O</div>
        <div class="character" aria-hidden="true">🥳</div>
        <div class="ox-button ox-button--x">X</div>
      </div>

      <div class="copy-block">
        <div class="copy-main">200문항 · 30라운드</div>
        <div class="copy-sub">라이프 ❤️ 3개로 도전!</div>
      </div>
    </div>
  </div>
</body>
</html>
